<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            /* Gumagalaw na Black Gradient Background */
            background: linear-gradient(135deg, #050505, #121212, #1a1a1a, #0a0a0a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Animation para sa gumagalaw na background */
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Sticky Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px); /* Nagbibigay ng glassmorphism effect sa likod ng nav */
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            border-bottom: 1px solid #222;
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-btn {
            background-color: #222222;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #333;
            transition: background-color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        /* Blank Sections Placeholder */
        section {
            min-height: 80vh;
            padding: 60px 20px;
            max-width: 1000px;
            margin: 30px auto;
            
            /* Semi-transparent dark background para lumitaw ang sections sa ibabaw ng moving background */
            background-color: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="#profile" class="nav-btn">Profile</a>
            <a href="#skills" class="nav-btn">Skills</a>
            <a href="#projects" class="nav-btn">Projects</a>
            <a href="#problem-solving" class="nav-btn">Problem-Solving</a>
            <a href="#employability" class="nav-btn">Employability</a>
            <a href="#resume" class="nav-btn">Resume</a>
            <a href="#certificates" class="nav-btn">Certificates/Achievements</a>
            <a href="#github" class="nav-btn">Github</a>
            <a href="#contact" class="nav-btn">Contact</a>
            <a href="#reflection" class="nav-btn">Reflection</a>
        </div>
    </nav>

    <!-- Empty Sections (Dito mo ilalagay ang content mo) -->
    <section id="profile">
        <!-- Dito ang Profile -->
    </section>

    <section id="skills">
        <!-- Dito ang Skills -->
    </section>

    <section id="projects">
        <!-- Dito ang Projects -->
    </section>

    <section id="problem-solving">
        <!-- Dito ang Problem-Solving -->
    </section>

    <section id="employability">
        <!-- Dito ang Employability -->
    </section>

    <section id="resume">
        <!-- Dito ang Resume -->
    </section>

    <section id="certificates">
        <!-- Dito ang Certificates/Achievements -->
    </section>

    <section id="github">
        <!-- Dito ang Github -->
    </section>

    <section id="contact">
        <!-- Dito ang Contact -->
    </section>

    <section id="reflection">
        <!-- Dito ang Reflection -->
    </section>

</body>
</html>
