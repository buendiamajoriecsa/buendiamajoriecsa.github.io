<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        /* Sticky Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background-color: #1e293b;
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-btn {
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .nav-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        /* Blank Sections Placeholder */
        section {
            min-height: 80vh;
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
            border-bottom: 1px dashed #ccc;
        }

        /* Optional Section Heading Style (Zero content inside body) */
        section h2 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="#profile" class="nav-btn">Profile</a>
            <a href="#skills" class="nav-btn">Skills</a>
            <a href="#projects" class="nav-btn">Projects</a>
            <a href="#problem-solving" class="nav-btn">Problem-Solving</a>
            <a href="#employability" class="nav-btn">Employability</a>
            <a href="#resume" class="nav-btn">Resume</a>
            <a href="#certificates" class="nav-btn">Certificates/Achievements</a>
            <a href="#github" class="nav-btn">Github</a>
            <a href="#contact" class="nav-btn">Contact</a>
            <a href="#reflection" class="nav-btn">Reflection</a>
        </div>
    </nav>

    <!-- Empty Sections (Dito mo ilalagay ang content mo) -->
    <section id="profile">
        <!-- Dito ang Profile -->
    </section>

    <section id="skills">
        <!-- Dito ang Skills -->
    </section>

    <section id="projects">
        <!-- Dito ang Projects -->
    </section>

    <section id="problem-solving">
        <!-- Dito ang Problem-Solving -->
    </section>

    <section id="employability">
        <!-- Dito ang Employability -->
    </section>

    <section id="resume">
        <!-- Dito ang Resume -->
    </section>

    <section id="certificates">
        <!-- Dito ang Certificates/Achievements -->
    </section>

    <section id="github">
        <!-- Dito ang Github -->
    </section>

    <section id="contact">
        <!-- Dito ang Contact -->
    </section>

    <section id="reflection">
        <!-- Dito ang Reflection -->
    </section>

</body>
</html>
