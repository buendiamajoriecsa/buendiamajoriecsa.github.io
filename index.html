<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            /* Static Background Image batay sa ibinigay mong litrato */
            background-image: url('bc.jpg');[cite: 1]
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000000; /* Fallback kung sakaling hindi mahanap ang image */
            
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Sticky Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid #1e293b;
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-btn {
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #0ea5e9;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #0ea5e9;
            color: #000000;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.6);
            transform: translateY(-2px);
        }

        /* Sections na may solid black background */
        section {
            min-height: 80vh;
            padding: 60px 20px;
            max-width: 1000px;
            margin: 40px auto;
            
            /* Solid Black background para sa bawat section */
            background-color: #000000;
            border-radius: 10px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="#profile" class="nav-btn">Profile</a>
            <a href="#skills" class="nav-btn">Skills</a>
            <a href="#projects" class="nav-btn">Projects</a>
            <a href="#problem-solving" class="nav-btn">Problem-Solving</a>
            <a href="#employability" class="nav-btn">Employability</a>
            <a href="#resume" class="nav-btn">Resume</a>
            <a href="#certificates" class="nav-btn">Certificates/Achievements</a>
            <a href="#github" class="nav-btn">Github</a>
            <a href="#contact" class="nav-btn">Contact</a>
            <a href="#reflection" class="nav-btn">Reflection</a>
        </div>
    </nav>

    <!-- Empty Sections -->
    <section id="profile"></section>
    <section id="skills"></section>
    <section id="projects"></section>
    <section id="problem-solving"></section>
    <section id="employability"></section>
    <section id="resume"></section>
    <section id="certificates"></section>
    <section id="github"></section>
    <section id="contact"></section>
    <section id="reflection"></section>

</body>
</html>
